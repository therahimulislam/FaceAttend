<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>FaceAttend — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .icon-wrap {
        width: 80px;
        height: 80px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }

      svg { display: block; }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }

      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        max-width: 320px;
        margin: 0 auto 2rem;
      }

      .retry-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.5rem;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        color: #f1f5f9;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s;
      }
      .retry-btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.2); }

      .status {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #475569;
      }

      /* Pulsing wifi-off icon animation */
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div class="icon-wrap">
      <svg class="pulse" width="40" height="40" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <!-- Wifi-off icon -->
        <path d="M1 1l22 22" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16.72 11.06A10.94 10.94 0 0119 12.55" stroke="#64748b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 12.55a10.94 10.94 0 0115.17-1.07" stroke="#64748b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
        <path d="M10.71 5.05A16 16 0 0122.56 9" stroke="#64748b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
        <path d="M1.42 9a15.91 15.91 0 014.7-2.88" stroke="#64748b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.53 16.11a6 6 0 016.95 0" stroke="#64748b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="20" r="1" fill="#64748b"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      FaceAttend can't connect right now. Check your internet connection and try again.
      Some features may still be available from your local cache.
    </p>

    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M1 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Try again
    </a>

    <p class="status" id="status-msg">Checking connection…</p>

    <script>
      // Auto-retry when connection is restored
      function checkOnline() {
        const msg = document.getElementById("status-msg");
        if (navigator.onLine) {
          msg.textContent = "Connection restored. Reloading…";
          setTimeout(() => window.location.reload(), 800);
        } else {
          msg.textContent = "Still offline. Waiting for connection…";
        }
      }

      window.addEventListener("online", checkOnline);
      checkOnline();
    </script>
  </body>
</html>
