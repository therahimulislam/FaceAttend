# =============================================================================
# FaceAttend — CI Pipeline
# Runs on every push / PR to main or develop.
#
# Jobs:
#   backend-test    — Django test suite (277 tests)
#   backend-check   — Django system check + migration check
#   frontend-build  — TypeScript check + Vite production build
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"

jobs:

  # ---------------------------------------------------------------------------
  # Backend: Django Test Suite
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faceattend/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       faceattend_test
          POSTGRES_USER:     faceattend_user
          POSTGRES_PASSWORD: faceattend_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faceattend_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://faceattend_user:faceattend_pass@localhost:5432/faceattend_test
      REDIS_URL:             redis://localhost:6379/0
      CELERY_BROKER_URL:     redis://localhost:6379/0
      SECRET_KEY:            ci-secret-key-not-for-production
      CAMPUS_LATITUDE:       "23.8103"
      CAMPUS_LONGITUDE:      "90.4125"
      CAMPUS_GEOFENCE_RADIUS_METERS: "200"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: faceattend/backend/requirements/*.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev build-essential

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: |
          python manage.py test \
            apps.accounts.tests \
            apps.students.tests \
            apps.academics.tests \
            apps.attendance.tests_phase6 \
            apps.attendance.tests_phase7 \
            apps.attendance.tests_phase8 \
            apps.attendance.tests_phase10 \
            apps.attendance.tests_phase12 \
            apps.attendance.tests_phase13 \
            apps.attendance.tests_phase14 \
            apps.analytics.tests_phase15 \
            apps.notifications.tests_phase16 \
            apps.audit.tests_phase17 \
            apps.ai_insights.tests_phase18 \
            apps.face.tests \
            apps.face.tests_phase11 \
            --verbosity=2

  # ---------------------------------------------------------------------------
  # Frontend: TypeScript Check + Production Build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faceattend/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: faceattend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build (includes TypeScript check)
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -f dist/sw.js              && echo "✓ Service worker"
          test -f dist/manifest.webmanifest && echo "✓ Web manifest"
          test -f dist/offline.html       && echo "✓ Offline shell"
          test -f dist/icons/icon-192x192.png && echo "✓ Icon 192"
          test -f dist/icons/icon-512x512.png && echo "✓ Icon 512"
