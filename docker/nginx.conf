# =============================================================================
# FaceAttend — Nginx Reverse Proxy Configuration (Production)
# =============================================================================
# Used by docker-compose.prod.yml.
# Nginx sits in front of Daphne (ASGI), serving:
#   - Static files directly (WhiteNoise also handles this, nginx is faster)
#   - HTTP → proxy_pass to backend:8000
#   - WebSocket upgrade for /ws/ paths
# =============================================================================

# Rate limiting zones (applied per IP)
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=face:10m    rate=20r/m;

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Max upload size (face images, reports)
    client_max_body_size 10M;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS — only enable once HTTPS termination is in place upstream (e.g. Cloudflare / load balancer)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------------------------------------------------------------------------
    # Static files — served directly by Nginx (fastest path)
    # ---------------------------------------------------------------------------
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Auth endpoints — strict rate limit (10 req/min per IP)
    # ---------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|token)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Face verification — moderate rate limit (20 req/min per IP)
    # ---------------------------------------------------------------------------
    location ~ ^/api/v1/face/ {
        limit_req zone=face burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # Face recognition can take longer
        proxy_send_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # General API — standard rate limit (60 req/min per IP)
    # ---------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # WebSocket (Django Channels)
    # ---------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;  # Long-lived WebSocket connections
    }

    # ---------------------------------------------------------------------------
    # Health check (no rate limit — used by Render/load balancer)
    # ---------------------------------------------------------------------------
    location /api/v1/health/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Frontend SPA — serve index.html for all other routes (if co-hosting)
    # Note: In production, frontend is hosted on Vercel/Render static site.
    #       This block handles self-hosted scenarios.
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # Error pages
    # ---------------------------------------------------------------------------
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error": "Too many requests. Please slow down.", "code": "RATE_LIMITED"}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error": "Service temporarily unavailable.", "code": "SERVICE_UNAVAILABLE"}';
        add_header Content-Type application/json;
    }
}
